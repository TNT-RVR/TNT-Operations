<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- iOS ignores the manifest's icons; this is the one it puts on the home
         screen, and it must be a real 180px image rather than a scaled 3000px one. -->
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <!--
      NO `viewport-fit=cover`.

      Cover lets the page draw UNDER the system bars, and the app then keeps
      itself clear with env(safe-area-inset-*). That works on iOS. On Android
      with three-button navigation the bottom inset is commonly reported as 0
      while the nav bar still overlays the viewport — so `.safe-bottom` added no
      padding and the app's OWN bottom bar rendered underneath the system one.
      Invisible, and intermittent, because the inset changes with gesture-vs-
      button navigation, rotation and the keyboard. Reported exactly that way:
      "it was gone for a while but now is back".

      Cover was here for `apple-mobile-web-app-status-bar-style:
      black-translucent`, which needed the page to reach behind the iOS status
      bar. That became `default` on 2026-08-27 when the app went light, so
      nothing needs cover any more. Without it the viewport is the genuinely
      visible area, 100dvh means what it says, and the bottom bar cannot hide.
    -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Light by default since 2026-08-27; the dark value is swapped in below
         when that is the stored choice, so the browser chrome matches. -->
    <meta name="theme-color" content="#FFFFFF" />
    <!-- Installed on iOS: run without Safari's chrome. `default` gives dark
         status-bar text, which is what a light app needs — `black-translucent`
         paints white glyphs and they vanished against the page. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="TNT Ops" />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>TNT Operations</title>
    <!--
      Theme before paint.

      The base stylesheet is dark and `.on-light` overrides it, so deciding this
      in React means a black screen on every cold load that then snaps to white.
      This runs synchronously in <head>, before the body exists, so there is
      nothing to flash. Kept in step with src/styles/theme.tsx — same key, same
      default; it is duplicated because nothing from the bundle has loaded yet.
    -->
    <script>
      (function () {
        try {
          var v = localStorage.getItem('tnt-theme-v2')
          var dark = v === 'dark'
          document.documentElement.classList.toggle('on-light', !dark)
          document.documentElement.style.colorScheme = dark ? 'dark' : 'light'
          var m = document.querySelector('meta[name="theme-color"]')
          if (m) m.setAttribute('content', dark ? '#050506' : '#FFFFFF')
        } catch (e) {
          /* private mode: fall through to the light default in the markup */
          document.documentElement.classList.add('on-light')
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
